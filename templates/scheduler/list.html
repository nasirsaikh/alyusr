{% extends 'portal/base.html' %}{% block page_title %}Scheduled Tasks{% endblock %}{% block portal_content %}<div class="card"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Task</th><th>Type</th><th>Schedule</th><th>Next run</th></tr></thead><tbody>{% for t in tasks %}<tr><td>{{ t.name }}</td><td>{{ t.get_task_type_display }}</td><td><code>{{ t.cron_expression }}</code></td><td>{{ t.next_run_at|default:'—' }}</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
