{% load i18n %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_CODE == 'ar' %}rtl{% else %}ltr{% endif %}" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Alyusr{% endblock %}</title>
  {% if site_settings.favicon %}<link rel="icon" href="{{ site_settings.favicon.url }}">{% endif %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% url 'public_site:theme_css' %}" rel="stylesheet">
  <style>
    :root{--alyusr-ink:#10231c;--alyusr-muted:#66756e;--alyusr-soft:#f3f8f5;--alyusr-border:rgba(15,118,110,.14);--alyusr-shadow:0 18px 55px rgba(16,35,28,.08)}
    html{scroll-behavior:smooth} body{background:var(--bs-body-bg);color:var(--bs-body-color);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.section-pad{padding:5rem 0}.section-soft{background:linear-gradient(180deg,rgba(22,101,52,.035),rgba(15,118,110,.065))}.section-label{display:inline-flex;align-items:center;gap:.5rem;padding:.45rem .8rem;border-radius:999px;background:rgba(22,101,52,.08);color:var(--alyusr-primary);font-weight:700;font-size:.8rem;letter-spacing:.02em}.display-title{font-size:clamp(2.35rem,5vw,4.75rem);line-height:1.02;letter-spacing:-.045em}.text-balance{text-wrap:balance}.navbar-brand img{max-height:44px}.site-navbar{backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bs-body-bg) 91%,transparent);border-bottom:1px solid var(--alyusr-border)}.topbar{font-size:.82rem;background:#0c2d22;color:#dff7eb}.topbar a{color:#dff7eb;text-decoration:none}.btn-primary{--bs-btn-bg:var(--alyusr-primary);--bs-btn-border-color:var(--alyusr-primary);--bs-btn-hover-bg:color-mix(in srgb,var(--alyusr-primary) 84%,black);--bs-btn-hover-border-color:var(--bs-btn-hover-bg)}.btn-outline-primary{--bs-btn-color:var(--alyusr-primary);--bs-btn-border-color:var(--alyusr-primary)}.text-primary{color:var(--alyusr-primary)!important}.bg-primary-subtle{background:color-mix(in srgb,var(--alyusr-primary) 10%,transparent)!important}.hero-shell{position:relative;overflow:hidden;background:radial-gradient(circle at 90% 10%,rgba(217,119,6,.22),transparent 30%),linear-gradient(135deg,#0b2b20 0%,var(--alyusr-primary) 52%,var(--alyusr-secondary) 100%);color:#fff;border-radius:0 0 2.25rem 2.25rem}.hero-shell:after{content:"";position:absolute;inset:auto -8rem -15rem auto;width:34rem;height:34rem;border:1px solid rgba(255,255,255,.12);border-radius:50%;box-shadow:0 0 0 4rem rgba(255,255,255,.025),0 0 0 8rem rgba(255,255,255,.018)}.hero-panel{position:relative;z-index:2}.glass-card{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(16px);border-radius:1.4rem}.metric-card,.feature-card,.service-card,.quote-card{border:1px solid var(--alyusr-border);border-radius:1.25rem;background:var(--bs-body-bg);box-shadow:var(--alyusr-shadow)}.metric-card{padding:1.4rem}.feature-card,.service-card{padding:1.6rem;height:100%;transition:transform .22s ease,box-shadow .22s ease}.feature-card:hover,.service-card:hover{transform:translateY(-4px);box-shadow:0 24px 65px rgba(16,35,28,.12)}.icon-box{width:3rem;height:3rem;border-radius:.9rem;display:inline-grid;place-items:center;background:color-mix(in srgb,var(--alyusr-primary) 12%,transparent);color:var(--alyusr-primary);font-size:1.25rem}.module-number{font-size:.72rem;font-weight:800;color:var(--alyusr-primary);letter-spacing:.1em}.workflow-line{position:relative}.workflow-line:before{content:"";position:absolute;top:1.45rem;left:8%;right:8%;height:2px;background:linear-gradient(90deg,var(--alyusr-primary),var(--alyusr-secondary));opacity:.22}.carrier-logo,.client-logo{height:64px;border:1px solid var(--alyusr-border);border-radius:1rem;display:flex;align-items:center;justify-content:center;padding:.9rem;background:var(--bs-body-bg)}.carrier-logo img,.client-logo img{max-width:100%;max-height:36px;object-fit:contain;filter:saturate(.8)}.avatar-placeholder{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--alyusr-primary),var(--alyusr-secondary));color:#fff;font-weight:800;font-size:1.3rem}.cta-band{background:linear-gradient(125deg,#0c2d22,var(--alyusr-primary));border-radius:1.5rem;color:#fff;overflow:hidden;position:relative}.footer-dark{background:#071c15;color:#bcd1c7}.footer-dark a{color:#e7f4ee;text-decoration:none}.footer-dark a:hover{color:#fff}.form-control,.form-select{border-radius:.8rem}.accordion-item{border-color:var(--alyusr-border)}[data-bs-theme="dark"]{--alyusr-soft:#10221b;--alyusr-border:rgba(156,220,188,.14);--alyusr-shadow:0 18px 55px rgba(0,0,0,.18)}[data-bs-theme="dark"] .section-soft{background:rgba(255,255,255,.02)}
    @media(max-width:991.98px){.section-pad{padding:3.75rem 0}.workflow-line:before{display:none}.hero-shell{border-radius:0 0 1.5rem 1.5rem}.display-title{letter-spacing:-.03em}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important;animation:none!important}}
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <script>
    (()=>{const saved=localStorage.getItem('alyusr-theme');const preferred=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-bs-theme',saved||preferred);window.toggleAlyusrTheme=()=>{const next=document.documentElement.getAttribute('data-bs-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-bs-theme',next);localStorage.setItem('alyusr-theme',next)}})();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@alpinejs/csp@3.15.0/dist/cdn.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
